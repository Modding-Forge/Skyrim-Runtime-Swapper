name: Tag release builds

on:
  workflow_dispatch:
    inputs:
      tested_run_id:
        description: 'Upload existing packages from a successful run (skips build/tests; blank builds without publishing)'
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: tag-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify tag matches source version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('vcpkg.json').read_text())['version-string']
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-rc\d+)?', version):
              raise SystemExit('Unsupported release version')
          if os.environ.get('RELEASE_EVENT') != 'workflow_dispatch' and os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Tag must match vcpkg.json release version')
          cmake = Path('CMakeLists.txt').read_text()
          if f'set(SKYRIM_RUNTIME_RELEASE_VERSION "{version}")' not in cmake:
              raise SystemExit('CMake release version mismatch')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - run: python3 tools/tests/verify-third-party-pins.py
      - run: python3 tools/package-7z.py --self-test
      - name: Validate previously tested release
        if: inputs.tested_run_id != ''
        uses: actions/github-script@v7
        env:
          TESTED_RUN_ID: ${{ inputs.tested_run_id }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const runId = process.env.TESTED_RUN_ID;
            if (!/^[0-9]+$/.test(runId)) throw new Error('Invalid run ID');
            const repo = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: runId});
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.path !== '.github/workflows/tag-builds.yml' || run.head_branch !== 'master' ||
                run.head_repository?.full_name !== `${repo.owner}/${repo.repo}` ||
                !['push', 'workflow_dispatch'].includes(run.event)) {
              throw new Error('Source must be a successful trusted release build from master');
            }
            const {data: diff} = await github.rest.repos.compareCommitsWithBasehead({
              ...repo, basehead: `${run.head_sha}...${context.sha}`
            });
            if (!['ahead', 'identical'].includes(diff.status) || !diff.files ||
                diff.files.length >= 300 || diff.files.some(file =>
                  file.filename !== '.github/workflows/tag-builds.yml' || file.status !== 'modified')) {
              throw new Error('Source changed since tests: rebuild required');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...repo, run_id: runId, per_page: 100
            });
            const name = `SRS-v${process.env.RELEASE_VERSION}-packages`;
            if (artifacts.filter(a => a.name === name && !a.expired).length !== 1) {
              throw new Error('Expected exactly one unexpired release artifact');
            }
            core.summary.addRaw(`Reusing verified packages from run ${runId}, commit ${run.head_sha}.`).write();

  native:
    needs: validate
    if: inputs.tested_run_id == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: '1.5.97', profile: bobw, catalog: '1.7.104-to-1.5.97' }
          - { target: '1.5.97', profile: boaw, catalog: '1.7.104-to-1.5.97' }
          - { target: '1.6.640', profile: bobw, catalog: '1.7.104-to-1.6.640' }
          - { target: '1.6.640', profile: boaw, catalog: '1.7.104-to-1.6.640' }
          - { target: '1.6.1170', profile: bobw, catalog: '1.7.104-to-1.6.1170' }
          - { target: '1.6.1170', profile: boaw, catalog: '1.7.104-to-1.6.1170' }
          - { target: '1.6.1170', profile: boaw-clean, catalog: '1.7.104-to-1.6.1170-clean' }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned build tools
        run: |
          python3 -m pip install --user cmake==3.31.6 ninja==1.11.1.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build native sidecar
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DSKYRIM_RUNTIME_BUILD_PROFILE=${{ matrix.profile }} \
            -DSKYRIM_RUNTIME_PATCH_MANIFEST="$PWD/assets/runtime/${{ matrix.catalog }}/manifest.json"
          cmake --build build/native --target runtime_swapper_native --parallel 4
      - name: Verify ABI, hardening and executable
        run: |
          python3 tools/tests/verify-elf-abi.py build/native/SkyrimRuntimeSwapper.Native
          bash tools/tests/verify-elf-hardening.sh build/native/SkyrimRuntimeSwapper.Native
          set +e
          printf short | build/native/SkyrimRuntimeSwapper.Native
          result=$?
          set -e
          test "$result" -eq 2
      - name: Preserve sidecar layout
        run: |
          mkdir -p sidecars/${{ matrix.target }}/${{ matrix.profile }}
          cp build/native/SkyrimRuntimeSwapper.Native sidecars/${{ matrix.target }}/${{ matrix.profile }}/
      - uses: actions/upload-artifact@v5
        with:
          name: sidecar-${{ matrix.target }}-${{ matrix.profile }}
          path: sidecars/
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: [validate, native]
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: sidecar-*
          merge-multiple: true
          path: native
      - name: Enable symlink fixtures
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Type DWord -Value 1
      - name: Build and stage all seven profiles (tests for stable releases only)
        shell: pwsh
        run: |
          cmake "-DNATIVE_SIDECAR_ROOT=$env:GITHUB_WORKSPACE/native" -DSTAGE_ONLY=ON -P tools/build-all.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PE hardening
        shell: pwsh
        run: |
          $binaries = Get-ChildItem dist/builds -Recurse -File | Where-Object { $_.Name -in @('version.dll', 'SkyrimRuntimeSwapper.exe') }
          if ($binaries.Count -ne 14) { throw 'Expected fourteen Windows binaries' }
          ./tools/tests/verify-pe-hardening.ps1 -Path $binaries.FullName
      - uses: actions/upload-artifact@v5
        with:
          name: staged-release
          path: dist/builds/
          if-no-files-found: error
          retention-days: 7

  packages:
    needs: [validate, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: staged-release
          path: staged
      - name: Package and round-trip verify
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          sources = sorted(Path('staged').glob(f'{version}/*/SRS-v{version}-*'))
          if len(sources) != 7 or any(not path.is_dir() for path in sources):
              raise SystemExit('Expected exactly seven staged packages')
          Path('release').mkdir()
          for source in sources:
              if not (source / 'SkyrimRuntimeSwapper.Native').is_file():
                  raise SystemExit('Missing native sidecar')
              subprocess.run(['python3', 'tools/package-7z.py', '--source', str(source),
                              '--output', f'release/{source.name}.7z'], check=True)
          PY
          cd release
          sha256sum -- *.7z > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: SRS-v${{ needs.validate.outputs.version }}-packages
          path: |
            release/*.7z
            release/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

  nexus:
    name: Nexus release (all seven packages)
    needs: [validate, packages]
    if: always() && !cancelled() && needs.validate.result == 'success' && (needs.packages.result == 'success' || (needs.packages.result == 'skipped' && inputs.tested_run_id != '')) && (github.event_name == 'push' || inputs.tested_run_id != '') && vars.NEXUS_UPLOAD_ENABLED == 'true' && !contains(needs.validate.outputs.version, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: nexus-production
    concurrency:
      group: nexus-release-upload
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: SRS-v${{ needs.validate.outputs.version }}-packages
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.tested_run_id || github.run_id }}
      - name: Verify all release checksums and credentials
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        working-directory: release
        run: |
          test -n "$NEXUS_API_KEY" || { echo 'Missing NEXUSMODS_API_KEY environment secret'; exit 1; }
          sha256sum --check --strict SHA256SUMS.txt
          test -f "SRS-v${RELEASE_VERSION}-BoBW-1.7.104-to-1.5.97.7z"
          test -f "SRS-v${RELEASE_VERSION}-BoBW-1.7.104-to-1.6.1170.7z"
          test -f "SRS-v${RELEASE_VERSION}-BoAW-1.7.104-to-1.5.97.7z"
          test -f "SRS-v${RELEASE_VERSION}-BoAW-1.7.104-to-1.6.1170.7z"
          test -f "SRS-v${RELEASE_VERSION}-BoBW-1.7.104-to-1.6.640.7z"
          test -f "SRS-v${RELEASE_VERSION}-BoAW-1.7.104-to-1.6.640.7z"
          test -f "SRS-v${RELEASE_VERSION}-BoAW-Clean-1.7.104-to-1.6.1170.7z"
      - name: Upload BoBW 1.5.97
        id: upload_7901739
        continue-on-error: true
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '7901739'
          filename: release/SRS-v${{ needs.validate.outputs.version }}-BoBW-1.7.104-to-1.5.97.7z
          version: v${{ needs.validate.outputs.version }}
          display_name: SRS - Best of Both Worlds - 1.7.104 to 1.5.97
          category: main
          archive_existing_version: 'false'
          update_mod_version: 'false'
          mod_id: '7318624462239'
      - name: Upload BoBW 1.6.1170
        id: upload_7901745
        continue-on-error: true
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '7901745'
          filename: release/SRS-v${{ needs.validate.outputs.version }}-BoBW-1.7.104-to-1.6.1170.7z
          version: v${{ needs.validate.outputs.version }}
          display_name: SRS - Best of Both Worlds - 1.7.104 to 1.6.1170
          category: main
          archive_existing_version: 'false'
          update_mod_version: 'false'
          mod_id: '7318624462239'
      - name: Upload BoAW 1.5.97
        id: upload_7901751
        continue-on-error: true
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '7901751'
          filename: release/SRS-v${{ needs.validate.outputs.version }}-BoAW-1.7.104-to-1.5.97.7z
          version: v${{ needs.validate.outputs.version }}
          display_name: SRS - Best of All Worlds - 1.7.104 to 1.5.97
          category: main
          archive_existing_version: 'false'
          update_mod_version: 'false'
          mod_id: '7318624462239'
      - name: Upload BoAW 1.6.1170
        id: upload_7901757
        continue-on-error: true
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '7901757'
          filename: release/SRS-v${{ needs.validate.outputs.version }}-BoAW-1.7.104-to-1.6.1170.7z
          version: v${{ needs.validate.outputs.version }}
          display_name: SRS - Best of All Worlds - 1.7.104 to 1.6.1170
          category: main
          archive_existing_version: 'false'
          update_mod_version: 'false'
          mod_id: '7318624462239'
      - name: Upload BoBW 1.6.640
        id: upload_8001684
        continue-on-error: true
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8001684'
          filename: release/SRS-v${{ needs.validate.outputs.version }}-BoBW-1.7.104-to-1.6.640.7z
          version: v${{ needs.validate.outputs.version }}
          display_name: SRS - Best of Both Worlds - 1.7.104 to 1.6.640
          category: main
          archive_existing_version: 'false'
          update_mod_version: 'false'
          mod_id: '7318624462239'
      - name: Upload BoAW 1.6.640
        id: upload_8001687
        continue-on-error: true
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8001687'
          filename: release/SRS-v${{ needs.validate.outputs.version }}-BoAW-1.7.104-to-1.6.640.7z
          version: v${{ needs.validate.outputs.version }}
          display_name: SRS - Best of All Worlds - 1.7.104 to 1.6.640
          category: main
          archive_existing_version: 'false'
          update_mod_version: 'false'
          mod_id: '7318624462239'
      - name: Upload BoAW-Clean 1.6.1170
        id: upload_7901760
        continue-on-error: true
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '7901760'
          filename: release/SRS-v${{ needs.validate.outputs.version }}-BoAW-Clean-1.7.104-to-1.6.1170.7z
          version: v${{ needs.validate.outputs.version }}
          display_name: SRS - BoAW and Cleaned - 1.7.104 to 1.6.1170
          category: miscellaneous
          archive_existing_version: 'false'
          # Update the page with the final file only when all earlier uploads succeeded.
          update_mod_version: ${{ steps.upload_7901739.outcome == 'success' && steps.upload_7901745.outcome == 'success' && steps.upload_7901751.outcome == 'success' && steps.upload_7901757.outcome == 'success' && steps.upload_8001684.outcome == 'success' && steps.upload_8001687.outcome == 'success' && 'true' || 'false' }}
          mod_id: '7318624462239'
      - name: Record upload results
        if: always()
        env:
          UPLOAD_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ['UPLOAD_STEPS'])
          failed = False
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for name, step in steps.items():
                  if not name.startswith('upload_'):
                      continue
                  outcome = step['outcome']
                  version = step.get('outputs', {}).get('version_id', 'not returned')
                  summary.write(f"Nexus file {name.removeprefix('upload_')}: {outcome}; version ID {version}\n\n")
                  failed |= outcome != 'success'
              summary.write('Do not rerun the entire upload job after a partial failure: successful uploads may be duplicated.\n')
          if failed:
              raise SystemExit('Not all Nexus uploads succeeded; review individual results before retrying')
          PY
